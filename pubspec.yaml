version: 1.1.2+5

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^0.1.2
  flutter_calendar_carousel: ^1.3.18
  firebase_core: ^0.4.0+6
  cloud_firestore: ^0.12.10+2
  firebase: ^5.0.3
  firebase_analytics: ^3.0.3
  firebase_storage: ^3.0.4
  firebase_auth: ^0.14.0+5
  google_maps_flutter: ^0.5.19+2
  google_maps_webservice: ^0.0.14
  bottom_navy_bar: ^5.1.0
  stopper: ^1.0.1
  flutter_rating_bar: ^2.0.0+1
  photo_view: ^0.4.2
  multi_image_picker: ^4.6.0-rc.1
  uuid: ^2.0.2
  pin_code_text_field: ^1.3.7
  flutter_swiper: ^1.1.6
  floating_search_bar: ^0.2.0
  geolocator: ^5.1.4+1
  url_launcher: ^5.2.3
  firebase_messaging: ^5.1.6
  keyboard_avoider: ^0.1.2
  firebase_admob: ^0.9.0+9
  permission_handler: ^4.0.0
  sqflite: ^1.1.7+2
  timeago: ^2.0.22
  flutter_launcher_icons: "^0.7.3"
  google_sign_in: ^4.0.14
  http: ^0.12.0+2
  rxdart: ^0.22.6
  share: ^0.6.3+3
  launch_review: ^2.0.0

flutter_icons:
  android: "launcher_icon" 
  ios: true
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "assets/icon_background.png"
  adaptive_icon_foreground: "assets/launcher_icon_ios.png"
  image_path_ios: "assets/launcher_icon_ios.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sobar_logo.png
    - assets/user.png
    - assets/map_style.json
    - assets/toddy_marker.png
    - assets/bevco_marker.png
    - assets/sobar_db.db
    - assets/background.png
    - assets/launcher_icon.png
    - assets/icon_background.png
    - assets/launcher_icon_ios.png
    - assets/no_alcohol.png
    - assets/google.png
    - assets/user_location.png
  fonts:
    - family:  MyFlutterApp
      fonts:
       - asset: assets/fonts/MyFlutterApp.ttf

  
